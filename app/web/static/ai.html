<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoClip · สร้างด้วย AI</title><link rel="stylesheet" href="/static/style.css?v=5"></head>
<body><main>
<header><a class="brand" href="/">AutoClip</a><nav class="app-nav"><a href="/">สร้างวิดีโอ</a><a class="active" href="/ai">สร้างด้วย AI</a><a href="/history">History</a><a href="/tts">Thai TTS</a></nav></header>
<section class="tool-card hero-card"><span class="eyebrow">AI CONTENT STUDIO</span><h1>สร้างวิดีโอด้วยผู้ช่วย Mamase</h1><p class="muted">คุยกับ AI เพื่อพัฒนาเรื่องราว จากนั้นตรวจทุก scene และภาพจริงก่อนสร้าง ZIP</p><div class="ai-start"><label for="topic">หัวข้อหรือแนวคิด</label><input id="topic" maxlength="500" placeholder="เช่น ทะเลสาบสีแดงที่อันตรายที่สุดในโลก"><button id="start">เริ่มโปรเจกต์</button><span id="status" class="muted" role="status"></span></div></section>
<section id="work" hidden class="ai-workspace"><div class="ai-chat tool-card"><div class="section-head"><div><span class="eyebrow">ASSISTANT</span><h2>คุยกับ AutoClip</h2></div><span class="pill">THAI · MAMASE</span></div><div id="chat" class="logs chat-log"></div><textarea id="msg" rows="4" placeholder="บอกแนวทาง ความยาว หรือขอให้แก้ไข script ได้เลย"></textarea><div class="action-row"><button id="send">ส่งข้อความ</button><button id="preview" class="secondary">สร้าง Scene Preview</button></div></div>
<div class="ai-preview tool-card"><div class="section-head"><div><span class="eyebrow">EDITORIAL REVIEW</span><h2>Scene Preview</h2></div><p id="state" class="muted"></p></div><div id="scenes" class="scene-list"></div><div class="preview-actions"><button id="confirm" disabled>ยืนยัน Scene Preview</button><button id="zip" disabled class="secondary">สร้าง ZIP อย่างเดียว</button><button id="render" disabled>สร้าง ZIP และสร้างวิดีโอ</button><a id="dl" class="button secondary" hidden>ดาวน์โหลด ZIP</a></div></div></section>
</main><script>
let id,project;const $=s=>document.querySelector(s);
function draw(){project.messages.forEach((m,i)=>{if(i>=$('#chat').children.length){const d=document.createElement('div');d.className='chat-message '+m.role;d.textContent=m.role==='assistant'?'Mamase: '+m.content:'คุณ: '+m.content;$('#chat').append(d)}});$('#state').textContent=project.status+' · revision '+project.revision;$('#scenes').replaceChildren(...project.scenes.map((s,i)=>{const d=document.createElement('article');d.className='scene-card';const showSub=s.show_subtitle!==false;const subPreview=showSub?'<p class="subtitle-preview">'+(s.subtitle||s.narration)+'</p>':'<p class="subtitle-preview muted" style="font-style:italic;color:#94a3b8;font-size:0.85rem;">🚫 ซับไตเติล: ปิด (มีข้อความในภาพแล้ว)</p>';const subSelect='<label style="display:inline-flex;align-items:center;gap:6px;margin:0;font-size:0.8rem;color:#94a3b8;">ซับไตเติล: <select class="sub-toggle" style="width:auto;margin:0;padding:5px 8px;font-size:0.8rem;background:#0d1527;border-radius:8px;"><option value="true" '+(showSub?'selected':'')+'>แสดง Subtitle (Show)</option><option value="false" '+(!showSub?'selected':'')+'>ไม่ใส่ Subtitle (Hide - มีคำในรูปแล้ว)</option></select></label>';d.innerHTML='<div class="scene-number">'+String(i+1).padStart(2,'0')+'</div><div class="scene-body"><h3>'+s.id+'</h3>'+(s.image_path?'<img src="/api/ai/projects/'+id+'/assets/'+s.image_path+'" alt="Scene '+(i+1)+' preview">':'<div class="image-placeholder">ยังไม่มีภาพ</div>')+'<p class="narration">'+s.narration+'</p>'+subPreview+'<div class="scene-meta"><span>'+s.motion+'</span><span>'+s.transition+'</span><span>'+s.estimated_duration+'s</span></div><div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:10px;">'+subSelect+'<button class="secondary regenerate" data-id="'+s.id+'">สร้างภาพใหม่</button></div></div>';d.querySelector('.sub-toggle').onchange=async(e)=>{await fetch('/api/ai/projects/'+id+'/scenes/'+s.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({show_subtitle:e.target.value==='true'})});await load()};d.querySelector('.regenerate').onclick=async()=>{d.querySelector('.regenerate').disabled=true;await fetch('/api/ai/projects/'+id+'/scenes/'+s.id+'/regenerate-image',{method:'POST'});await load()};return d}));const ready=project.status==='PREVIEW_CONFIRMED';$('#confirm').disabled=!project.scenes.length||ready;$('#zip').disabled=!ready;$('#render').disabled=!ready}
async function load(){project=await (await fetch('/api/ai/projects/'+id)).json();draw()}
$('#start').onclick=async()=>{const r=await fetch('/api/ai/projects?topic='+encodeURIComponent($('#topic').value),{method:'POST'});project=await r.json();if(!r.ok){$('#status').textContent=project.detail?.message||'เริ่มโปรเจกต์ไม่สำเร็จ';return}id=project.project_id;$('#work').hidden=false;draw()};
$('#send').onclick=async()=>{const input=$('#msg');if(!input.value.trim())return;$('#send').disabled=true;const showError=m=>{let box=$('#chatError');if(!box){box=document.createElement('div');box.id='chatError';box.className='inline-error';$('#msg').before(box)}box.textContent=m;box.hidden=false;$('#status').textContent='ส่งข้อความไม่สำเร็จ'};$('#status').textContent='กำลังส่งข้อความ…';try{const r=await fetch('/api/ai/projects/'+id+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:input.value})});const data=await r.json();if(!r.ok){const detail=data.detail||{};showError((detail.code||'AI_REQUEST_FAILED')+': '+(detail.message||'ส่งข้อความไม่สำเร็จ'));return}input.value='';project=data;draw();$('#status').textContent=''}catch(e){showError('NETWORK_ERROR: ไม่สามารถเชื่อมต่อ server ได้')}finally{$('#send').disabled=false}};
$('#preview').onclick=async()=>{const button=$('#preview');button.disabled=true;$('#status').textContent='กำลังสร้าง Scene Preview…';const r=await fetch('/api/ai/projects/'+id+'/preview',{method:'POST'});project=await r.json();$('#status').textContent=r.ok?'สร้าง Preview แล้ว':'สร้าง Preview ไม่สำเร็จ';draw();button.disabled=false};
$('#confirm').onclick=async()=>{project=await (await fetch('/api/ai/projects/'+id+'/confirm',{method:'POST'})).json();draw()};
$('#zip').onclick=async()=>{const r=await fetch('/api/ai/projects/'+id+'/package',{method:'POST'});const d=await r.json();$('#dl').href=d.packageUrl;$('#dl').hidden=false};
$('#render').onclick=async()=>{const d=await (await fetch('/api/ai/projects/'+id+'/package-and-generate',{method:'POST'})).json();location.href='/jobs/'+d.jobId};
</script></body></html>
