<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoClip · จัดการ Channel</title><link rel="stylesheet" href="/static/style.css?v=24"></head><body><main>
<header><a class="brand" href="/"><img class="brand-logo" src="/static/auto-clip-logo.png" alt="AutoClip">AutoClip</a><nav class="app-nav"><a href="/">สร้างวิดีโอ</a><a href="/ai">สร้างด้วย AI</a><a href="/podcast">สร้าง Podcast</a><a href="/zodiac-weekly">🔮 ดวง 12 ราศี</a><a href="/history">History</a><a class="active" href="/channels">Channels</a></nav></header>
<section class="tool-card hero-card"><div><span class="eyebrow">CONTENT CHANNELS</span><h1>จัดการ Channel</h1><p class="muted">เพิ่ม Channel หรือเปลี่ยนชื่อได้จากที่เดียว Dropdown ทุกหน้าจะอัปเดตตามรายการนี้</p></div></section>
<section class="tool-card"><h2>เพิ่ม Channel</h2><div class="channel-create"><input id="newName" maxlength="100" placeholder="ชื่อ Channel ใหม่"><button id="create" class="button">เพิ่ม Channel</button></div><p id="status" class="muted" aria-live="polite"></p><div id="channels" class="channel-list"></div></section>
</main><script src="/static/channels.js?v=1"></script><script>
const root=document.querySelector('#channels'),status=document.querySelector('#status');
async function load(){try{const channels=await AutoClipChannels.fetchChannels();root.replaceChildren(...channels.map(channel=>{const row=document.createElement('div');row.className='channel-row';const input=document.createElement('input');input.value=channel.name;input.maxLength=100;input.disabled=channel.id==='undefined';const button=document.createElement('button');button.className='button secondary';button.textContent=channel.id==='undefined'?'ค่าเริ่มต้นงานเก่า':'บันทึกชื่อ';button.disabled=channel.id==='undefined';button.onclick=async()=>{button.disabled=true;const response=await fetch(`/api/channels/${encodeURIComponent(channel.id)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:input.value})});const data=await response.json().catch(()=>({}));status.textContent=response.ok?'บันทึกชื่อ Channel แล้ว':(data.detail?.message||'บันทึกไม่สำเร็จ');button.disabled=false;if(response.ok)load()};row.append(input,button);return row}))}catch(error){status.textContent=error.message}}
document.querySelector('#create').onclick=async()=>{const input=document.querySelector('#newName'),name=input.value.trim();if(!name){status.textContent='กรุณาใส่ชื่อ Channel';return}const response=await fetch('/api/channels',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});const data=await response.json().catch(()=>({}));status.textContent=response.ok?'เพิ่ม Channel แล้ว':(data.detail?.message||'เพิ่มไม่สำเร็จ');if(response.ok){input.value='';load()}};load();
</script><script src="/static/nav.js?v=4"></script></body></html>
