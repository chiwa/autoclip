<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AutoClip · Project History</title>
  <link rel="icon" type="image/png" href="/static/auto-clip-logo.png">
  <link rel="stylesheet" href="/static/style.css?v=25">
</head>
<body><main>
<header><a class="brand" href="/"><img class="brand-logo" src="/static/auto-clip-logo.png" alt="AutoClip Logo">AutoClip</a><nav class="app-nav"><a href="/">สร้างวิดีโอ</a><a href="/ai">สร้างด้วย AI</a><a href="/podcast">สร้าง Podcast</a><a href="/zodiac-weekly">🔮 ดวง 12 ราศี</a><a href="/antigravity">คำสั่งสร้างภาพ</a><a class="active" href="/history">History</a><a href="/tts">Thai TTS</a></nav></header>
<section class="tool-card hero-card"><div class="hero-header"><div><span class="eyebrow">PROJECT HISTORY</span><h1>โปรเจกต์ของคุณ</h1><p class="muted">เปิดดูงานเดิม ดาวน์โหลดไฟล์ และติดตามว่างานใดเผยแพร่แล้ว</p></div><div class="hero-logo-badge"><img src="/static/auto-clip-logo.png" alt="AutoClip Logo" class="hero-logo-img"></div></div></section>
<nav id="types" class="history-tabs" role="tablist" aria-label="กรองประเภทโปรเจกต์">
<button class="history-tab type-tab active" role="tab" aria-selected="true" data-type="all">ทุกประเภท <span id="countTypesAll">0</span></button>
<button class="history-tab type-tab" role="tab" aria-selected="false" data-type="reel">Reels &amp; Video <span id="countReels">0</span></button>
<button class="history-tab type-tab" role="tab" aria-selected="false" data-type="quick-reel">Quick Reel <span id="countQuickReel">0</span></button>
<button class="history-tab type-tab" role="tab" aria-selected="false" data-type="podcast">Podcast <span id="countPodcasts">0</span></button>
<button class="history-tab type-tab" role="tab" aria-selected="false" data-type="zodiac">ดวง 12 ราศี <span id="countZodiac">0</span></button>
</nav>
<div class="history-toolbar">
  <nav id="filters" class="history-tabs history-status-tabs" role="tablist" aria-label="กรองสถานะการเผยแพร่" style="margin:0;">
    <button class="history-tab active" role="tab" aria-selected="true" data-filter="all">ทั้งหมด <span id="countAll">0</span></button>
    <button class="history-tab" role="tab" aria-selected="false" data-filter="unpublished">ยังไม่เผยแพร่ <span id="countUnpublished">0</span></button>
    <button class="history-tab" role="tab" aria-selected="false" data-filter="published">เผยแพร่แล้ว <span id="countPublished">0</span></button>
  </nav>
  <div class="history-channel-filter" style="margin:0; display:flex; align-items:center; gap:10px;">
    <label for="channelFilter" style="margin:0; display:inline-flex; align-items:center; gap:8px;">
      <span style="font-weight:600; color:var(--soft);">Channel:</span>
      <select id="channelFilter" style="min-width:180px;"><option value="all">ทุก Channel</option></select>
    </label>
    <a class="button secondary small" href="/channels">จัดการ Channel</a>
  </div>
</div>
<section id="list" class="history-list" aria-live="polite"></section>
</main><script>
const list=document.querySelector('#list'),statusTabs=[...document.querySelectorAll('[data-filter]')],typeTabs=[...document.querySelectorAll('[data-type]')],channelFilter=document.querySelector('#channelFilter');
const pagePreset=location.pathname==='/reels-history'?'reel':location.pathname==='/quick-reel-history'?'quick-reel':location.pathname==='/podcast-history'?'podcast':null;
const historyFilterStorageKey=`autoclip.history.filters.${pagePreset||'all'}`;
function readHistoryFilters(){try{const value=JSON.parse(localStorage.getItem(historyFilterStorageKey)||'null');return value&&typeof value==='object'?value:{}}catch(_){localStorage.removeItem(historyFilterStorageKey);return {}}}
const savedHistoryFilters=readHistoryFilters();
let projects=[],activeFilter=['all','unpublished','published'].includes(savedHistoryFilters.filter)?savedHistoryFilters.filter:'all',activeType=pagePreset||(['all','reel','quick-reel','podcast','zodiac'].includes(savedHistoryFilters.type)?savedHistoryFilters.type:'all'),activeChannel=savedHistoryFilters.channel||'all';
function saveHistoryFilters(){try{localStorage.setItem(historyFilterStorageKey,JSON.stringify({filter:activeFilter,type:activeType,channel:activeChannel}))}catch(_){}}
function syncHistoryFilterTabs(){statusTabs.forEach(item=>{const active=item.dataset.filter===activeFilter;item.classList.toggle('active',active);item.setAttribute('aria-selected',String(active))});typeTabs.forEach(item=>{const active=item.dataset.type===activeType;item.classList.toggle('active',active);item.setAttribute('aria-selected',String(active))})}
function button(label,href,action){const el=href?document.createElement('a'):document.createElement('button');el.textContent=label;el.className='button secondary small';if(href)el.href=href;if(action)el.onclick=action;return el}
function typeMatches(p){return activeType==='all'||(activeType==='zodiac'?['zodiac','zodiac_batch'].includes(p.project_type):p.project_type===activeType)}
function visibleProjects(){return projects.filter(p=>typeMatches(p)&&(activeChannel==='all'||p.channelId===activeChannel)&&(activeFilter==='all'||(activeFilter==='published'?p.published:!p.published)))}
function updateCounts(){const typed=projects.filter(typeMatches);document.querySelector('#countTypesAll').textContent=projects.length;document.querySelector('#countReels').textContent=projects.filter(p=>p.project_type==='reel').length;document.querySelector('#countQuickReel').textContent=projects.filter(p=>p.project_type==='quick-reel').length;document.querySelector('#countPodcasts').textContent=projects.filter(p=>p.project_type==='podcast').length;document.querySelector('#countZodiac').textContent=projects.filter(p=>['zodiac','zodiac_batch'].includes(p.project_type)).length;document.querySelector('#countAll').textContent=typed.length;document.querySelector('#countPublished').textContent=typed.filter(p=>p.published).length;document.querySelector('#countUnpublished').textContent=typed.filter(p=>!p.published).length}
async function setPublished(project,published,control){if(control)control.disabled=true;try{const response=await fetch(`/api/history/${encodeURIComponent(project.id)}/published`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({published})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail?.message||'เปลี่ยนสถานะไม่สำเร็จ');project.published=data.published;project.published_at=data.publishedAt;updateCounts();render()}catch(error){alert(error.message)}finally{if(control)control.disabled=false}}
let allChannels=[];
function formatDur(sec){if(!sec||isNaN(sec))return '';const s=Math.round(sec),m=Math.floor(s/60),r=s%60;return m>0?`${m}:${String(r).padStart(2,'0')}`:`${r}s`}
function formatBytes(bytes){if(!bytes||bytes<=0)return '';if(bytes<1024*1024)return `${(bytes/1024).toFixed(0)} KB`;return `${(bytes/(1024*1024)).toFixed(1)} MB`}
function formatDate(iso){if(!iso)return '-';try{const d=new Date(iso);return d.toLocaleDateString('th-TH',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch{return iso}}

function render() {
  list.replaceChildren();
  const items = visibleProjects();
  if (!items.length) {
    const empty = document.createElement('section');
    empty.className = 'tool-card history-empty';
    empty.textContent = projects.length ? 'ไม่มีโปรเจกต์ในสถานะนี้' : 'ยังไม่มีโปรเจกต์';
    list.append(empty);
    return;
  }

  for (const p of items) {
    const project = p;
    const item = document.createElement('article');
    item.className = 'history-item-row';

    const left = document.createElement('div');
    left.className = 'history-col-left';

    const job = p.latestJob;
    const meta = job?.metadata || {};
    const vm = meta.videoMetadata || {};
    const qr = meta.quickReel || {};
    const res = meta.resolution || '';
    const isLandscape = res ? (Number(res.split('x')[0]) > Number(res.split('x')[1])) : (p.project_type === 'podcast');

    // Compact Thumbnail ("ไม่ต้องใหญ่" 56x40px with lazy image + icon fallback)
    const thumb = document.createElement('a');
    thumb.className = `history-item-thumb ${job?.videoAvailable ? 'has-video' : ''}`;
    const previewUrl = job?.previewUrl || (job ? `/jobs/${job.id}` : '#');
    thumb.href = previewUrl;
    thumb.title = job?.videoAvailable ? 'คลิกเพื่อดูวิดีโอ (Click to preview)' : (p.title || '');

    const typeIcon = p.project_type === 'podcast' ? '🎙️' : (['zodiac', 'zodiac_batch'].includes(p.project_type) ? '🔮' : '🎬');
    const iconSpan = document.createElement('span');
    iconSpan.className = 'thumb-type-icon';
    iconSpan.textContent = typeIcon;

    if (job?.id) {
      const img = document.createElement('img');
      img.src = `/api/jobs/${encodeURIComponent(job.id)}/thumbnail`;
      img.alt = '';
      img.loading = 'lazy';
      img.className = 'thumb-img';
      img.onload = () => {
        iconSpan.style.display = 'none';
      };
      img.onerror = () => {
        img.remove();
        iconSpan.style.display = 'flex';
      };
      thumb.append(img);
    }
    thumb.append(iconSpan);

    if (job?.videoAvailable) {
      const playPill = document.createElement('span');
      playPill.className = 'thumb-play-pill';
      playPill.textContent = '▶';
      thumb.append(playPill);
    }

    // Info block
    const info = document.createElement('div');
    info.className = 'history-item-info';

    // Row 1: Title, Status, Published, Type
    const titleRow = document.createElement('div');
    titleRow.className = 'history-title-row';

    const titleLink = document.createElement('a');
    titleLink.className = 'history-item-title';
    titleLink.href = previewUrl;
    titleLink.textContent = p.title || '-';
    titleLink.title = p.title || '';

    const statusText = job?.status || p.status || 'READY';
    const statusBadge = document.createElement('span');
    statusBadge.className = `history-status-badge status-${statusText.toLowerCase()}`;
    statusBadge.textContent = statusText;

    const pubPill = document.createElement('button');
    pubPill.type = 'button';
    pubPill.className = `publish-pill ${p.published ? 'published' : ''}`;
    pubPill.textContent = p.published ? '✓ เผยแพร่แล้ว' : '⏳ ยังไม่เผยแพร่';
    pubPill.title = 'คลิกเพื่อสลับสถานะเผยแพร่';
    pubPill.onclick = () => setPublished(p, !p.published, pubPill);

    const typeBadge = document.createElement('span');
    typeBadge.className = 'type-pill';
    typeBadge.textContent = p.project_type === 'quick-reel' ? 'Quick Reel' : p.project_type === 'podcast' ? 'Podcast' : (['zodiac', 'zodiac_batch'].includes(p.project_type) ? '12 ราศี' : 'Reel');

    titleRow.append(titleLink, statusBadge, pubPill, typeBadge);

    // Row 2: Specs Chips
    const specsRow = document.createElement('div');
    specsRow.className = 'history-specs-row';

    if (res) {
      const resChip = document.createElement('span');
      resChip.className = 'spec-chip';
      resChip.textContent = `📐 ${res}`;
      specsRow.append(resChip);
    }
    if (qr.motion && qr.motion !== 'none') {
      const motionChip = document.createElement('span');
      motionChip.className = 'spec-chip';
      motionChip.textContent = `🎬 ${qr.motion}`;
      specsRow.append(motionChip);
    }
    if (qr.fit) {
      const fitChip = document.createElement('span');
      fitChip.className = 'spec-chip';
      fitChip.textContent = `🖼️ ${qr.fit}`;
      specsRow.append(fitChip);
    }
    if (meta.durationSeconds) {
      const durChip = document.createElement('span');
      durChip.className = 'spec-chip';
      durChip.textContent = `⏱️ ${Number(meta.durationSeconds).toFixed(1)}s`;
      specsRow.append(durChip);
    }
    if (meta.fileSizeBytes) {
      const sizeChip = document.createElement('span');
      sizeChip.className = 'spec-chip';
      sizeChip.textContent = `📦 ${formatBytes(meta.fileSizeBytes)}`;
      specsRow.append(sizeChip);
    }
    const dateChip = document.createElement('span');
    dateChip.className = 'spec-chip';
    dateChip.textContent = `📅 ${formatDate(p.updated_at)}`;
    specsRow.append(dateChip);

    // Channel selector inline
    if (allChannels.length > 0) {
      const chanLabel = document.createElement('label');
      chanLabel.dataset.channelEditor = 'true';
      chanLabel.setAttribute('data-channel-editor', 'true');
      chanLabel.style.display = 'inline-flex';
      chanLabel.style.alignItems = 'center';
      chanLabel.style.gap = '3px';
      chanLabel.style.fontSize = '10.5px';
      chanLabel.title = 'Channel ของคลิปนี้';
      const chanSel = document.createElement('select');
      chanSel.className = 'spec-channel-select';
      allChannels.forEach(c => chanSel.append(new Option(c.name, c.id)));
      chanSel.value = p.channelId || (allChannels[0]?.id || '');
      chanSel.onchange = async () => {
        try {
          const res = await fetch(`/api/history/${encodeURIComponent(project.id)}/channel`, {
            method: 'PATCH',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({channelId: chanSel.value})
          });
          if (res.ok) {
            p.channelId = chanSel.value;
            chanSel.style.borderColor = 'var(--cyan)';
            setTimeout(() => chanSel.style.borderColor = '', 1200);
          }
        } catch (_) {}
      };
      const saveBtn = document.createElement('button');
      saveBtn.type = 'button';
      saveBtn.style.display = 'none';
      saveBtn.textContent = 'บันทึก Channel';
      chanLabel.append('🏷️ ', chanSel, saveBtn);
      specsRow.append(chanLabel);
    }

    // Row 3: Compact Caption Bar (1 line with Copy Title, Copy Caption, Expand toggle)
    const descText = (vm.description && vm.description !== '-') ? vm.description : (p.description && p.description !== '-' ? p.description : '');
    if (descText) {
      const captionBar = document.createElement('div');
      captionBar.className = 'history-caption-bar';

      const snippet = document.createElement('span');
      snippet.className = 'caption-snippet';
      snippet.textContent = descText;
      snippet.title = descText;

      const tools = document.createElement('div');
      tools.className = 'caption-tools';

      const copyTitleBtn = document.createElement('button');
      copyTitleBtn.type = 'button';
      copyTitleBtn.className = 'btn-copy-chip';
      copyTitleBtn.textContent = '📋 Title';
      copyTitleBtn.title = 'คัดลอกชื่อหัวข้อ';
      copyTitleBtn.onclick = () => {
        navigator.clipboard.writeText(vm.title || p.title || '');
        copyTitleBtn.textContent = '✓ Copied!';
        copyTitleBtn.classList.add('copied');
        setTimeout(() => { copyTitleBtn.textContent = '📋 Title'; copyTitleBtn.classList.remove('copied'); }, 1800);
      };

      const copyCaptionBtn = document.createElement('button');
      copyCaptionBtn.type = 'button';
      copyCaptionBtn.className = 'btn-copy-chip';
      copyCaptionBtn.textContent = '📋 Caption';
      copyCaptionBtn.title = 'คัดลอกคำบรรยายและแฮชแท็ก';
      copyCaptionBtn.onclick = () => {
        navigator.clipboard.writeText(descText);
        copyCaptionBtn.textContent = '✓ Copied!';
        copyCaptionBtn.classList.add('copied');
        setTimeout(() => { copyCaptionBtn.textContent = '📋 Caption'; copyCaptionBtn.classList.remove('copied'); }, 1800);
      };

      const expandBtn = document.createElement('button');
      expandBtn.type = 'button';
      expandBtn.className = 'btn-expand-chip';
      expandBtn.textContent = '▼ ขยาย';

      const fullBox = document.createElement('div');
      fullBox.className = 'caption-full-box';
      fullBox.hidden = true;
      fullBox.textContent = descText;

      expandBtn.onclick = () => {
        fullBox.hidden = !fullBox.hidden;
        expandBtn.textContent = fullBox.hidden ? '▼ ขยาย' : '▲ ย่อ';
      };

      tools.append(copyTitleBtn, copyCaptionBtn, expandBtn);
      captionBar.append(snippet, tools);
      info.append(titleRow, specsRow, captionBar, fullBox);
    } else {
      info.append(titleRow, specsRow);
    }

    left.append(thumb, info);

    // Right Column: Action Buttons
    const right = document.createElement('div');
    right.className = 'history-col-right';

    if (job?.videoAvailable) {
      const btnWatch = document.createElement('a');
      btnWatch.href = previewUrl;
      btnWatch.className = 'button primary small';
      btnWatch.textContent = '🎬 ดูวิดีโอ';
      right.append(btnWatch);

      const btnDl = document.createElement('a');
      btnDl.href = job.videoUrl;
      btnDl.download = `video-${p.id}.mp4`;
      btnDl.className = 'button secondary small';
      btnDl.textContent = '⬇️ MP4';
      right.append(btnDl);

      const btnYt = document.createElement('button');
      btnYt.type = 'button';
      btnYt.className = 'button secondary small';
      btnYt.textContent = '🔴 YouTube';
      btnYt.onclick = () => uploadYtForm(p);
      right.append(btnYt);
    } else if (p.latestJob && ['RECEIVED', 'VALIDATING', 'GENERATING_AUDIO', 'RENDERING_SCENES', 'COMPOSING'].includes(p.latestJob.status)) {
      right.append(button('ดูความคืบหน้า', `/jobs/${p.latestJob.id}`));
    }

    if (['zodiac', 'zodiac_batch'].includes(p.project_type)) {
      right.append(button('ดูคลิปทั้งหมด (View All)', `/zodiac-history?batch=${encodeURIComponent(p.id)}&view=all`));
    }

    const btnTrash = document.createElement('button');
    btnTrash.type = 'button';
    btnTrash.className = 'btn-trash-icon';
    btnTrash.textContent = '🗑️';
    btnTrash.title = 'ย้ายไปถังขยะ';
    btnTrash.onclick = async () => {
      if (confirm(`ย้ายโปรเจกต์ "${p.title}" ไปถังขยะหรือไม่?`)) {
        try {
          const res = await fetch(`/api/ai/projects/${encodeURIComponent(p.id)}`, { method: 'DELETE' });
          if (res.ok) load();
          else alert('ย้ายโปรเจกต์ไม่สำเร็จ');
        } catch (_) {}
      }
    };
    right.append(btnTrash);

    item.append(left, right);
    list.append(item);
  }
}

async function load(){list.textContent='กำลังโหลดประวัติ…';try{const [historyResponse,channelResponse]=await Promise.all([fetch('/api/history'),fetch('/api/channels')]);if(!historyResponse.ok||!channelResponse.ok)throw new Error();projects=(await historyResponse.json()).projects||[];allChannels=(await channelResponse.json()).channels||[];channelFilter.replaceChildren(new Option('ทุก Channel','all'),...allChannels.map(channel=>new Option(channel.name,channel.id)));if(![...channelFilter.options].some(option=>option.value===activeChannel))activeChannel='all';channelFilter.value=activeChannel;updateCounts();render()}catch(error){list.textContent='โหลด Project History ไม่สำเร็จ กรุณาลองใหม่'}}
statusTabs.forEach(tab=>tab.onclick=()=>{activeFilter=tab.dataset.filter;syncHistoryFilterTabs();saveHistoryFilters();render()});
typeTabs.forEach(tab=>tab.onclick=()=>{activeType=tab.dataset.type;syncHistoryFilterTabs();saveHistoryFilters();updateCounts();render()});
channelFilter.onchange=()=>{activeChannel=channelFilter.value;saveHistoryFilters();render()};
async function uploadYtForm(p){const cr=await fetch('/api/youtube/connections');const cd=await cr.json();if(!(cd.connections||[]).length){if(confirm('ยังไม่มีช่อง YouTube เชื่อมต่อ ต้องการเชื่อมต่อหรือไม่?'))location.href='/api/youtube/connect';return}const dialog=document.createElement('dialog');dialog.innerHTML='<form method="dialog" style="min-width:min(520px,90vw)"><h2>Upload to YouTube</h2><label>Channel<select id="ytc"></select></label><label>Title<input id="ytt" required maxlength="100"></label><label>Description<textarea id="ytd" maxlength="5000"></textarea></label><label>Tags<input id="ytg" placeholder="tag1, tag2"></label><label>Visibility<select id="ytp"><option value="private">Private</option><option value="unlisted">Unlisted</option><option value="public">Public</option></select></label><div class="actions"><button value="cancel">Cancel</button><button id="yts" value="default">Upload</button></div></form>';document.body.append(dialog);const channel=dialog.querySelector('#ytc');cd.connections.forEach(c=>{const option=document.createElement('option');option.value=c.id;option.textContent=c.channel_title;channel.append(option)});const meta=p.latestJob?.metadata?.videoMetadata||{};dialog.querySelector('#ytt').value=(meta.title&&meta.title!=='-')?meta.title:p.title;if(meta.description&&meta.description!=='-')dialog.querySelector('#ytd').value=meta.description;if(meta.tags)dialog.querySelector('#ytg').value=Array.isArray(meta.tags)?meta.tags.join(', '):meta.tags;dialog.querySelector('form').onsubmit=async event=>{event.preventDefault();const submit=dialog.querySelector('#yts');submit.disabled=true;submit.textContent='Uploading…';const response=await fetch('/api/history/'+encodeURIComponent(p.id)+'/youtube/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({connectionId:channel.value,title:dialog.querySelector('#ytt').value,description:dialog.querySelector('#ytd').value,tags:dialog.querySelector('#ytg').value.split(',').map(x=>x.trim()).filter(Boolean),privacyStatus:dialog.querySelector('#ytp').value})});const data=await response.json();submit.disabled=false;submit.textContent='Upload';if(!response.ok)alert((data.detail?.code||'YOUTUBE_UPLOAD_FAILED')+': '+(data.detail?.message||'อัปโหลดไม่สำเร็จ'));else{dialog.close();alert('อัปโหลดสำเร็จ\n'+data.url);load()}};dialog.addEventListener('close',()=>dialog.remove());dialog.showModal()}
syncHistoryFilterTabs();
load();
</script><script>
const preset=pagePreset;
if(preset){activeType=preset;syncHistoryFilterTabs();saveHistoryFilters();document.querySelector('#types').hidden=true;const name=preset==='reel'?'Reels History':preset==='quick-reel'?'Quick Reel History':'Podcast History';document.title=`AutoClip · ${name}`;document.querySelector('.hero-card h1').textContent=name;document.querySelector('.hero-card .muted').textContent=preset==='reel'?'งานวิดีโอและ Reels แยกจาก Podcast และคนเหนือดวง':preset==='quick-reel'?'งาน Quick Reel หลายภาพ • เสียงเดียว แยกเป็นเอกเทศ':'งาน Podcast แยกจาก Reels และคนเหนือดวง'}
const historyLink=document.querySelector('.app-nav a[href="/history"]');if(historyLink){for(const [label,href] of [['Reels History','/reels-history'],['Quick Reel History','/quick-reel-history'],['Podcast History','/podcast-history'],['คนเหนือดวง History','/zodiac-history']]){if(!document.querySelector(`.app-nav a[href="${href}"]`)){const link=document.createElement('a');link.href=href;link.textContent=label;if(location.pathname===href)link.className='active';historyLink.before(link)}}if(preset)historyLink.removeAttribute('class')}
</script><script src="/static/nav.js?v=6"></script></body></html>
