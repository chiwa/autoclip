<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AutoClip · Project History</title>
  <link rel="icon" type="image/png" href="/static/auto-clip-logo.png">
  <link rel="stylesheet" href="/static/style.css?v=24">
</head>
<body><main>
<header><a class="brand" href="/"><img class="brand-logo" src="/static/auto-clip-logo.png" alt="AutoClip Logo">AutoClip</a><nav class="app-nav"><a href="/">สร้างวิดีโอ</a><a href="/ai">สร้างด้วย AI</a><a href="/podcast">สร้าง Podcast</a><a href="/zodiac-weekly">🔮 ดวง 12 ราศี</a><a href="/antigravity">คำสั่งสร้างภาพ</a><a class="active" href="/history">History</a><a href="/tts">Thai TTS</a></nav></header>
<section class="tool-card hero-card"><div class="hero-header"><div><span class="eyebrow">PROJECT HISTORY</span><h1>โปรเจกต์ของคุณ</h1><p class="muted">เปิดดูงานเดิม ดาวน์โหลดไฟล์ และติดตามว่างานใดเผยแพร่แล้ว</p></div><div class="hero-logo-badge"><img src="/static/auto-clip-logo.png" alt="AutoClip Logo" class="hero-logo-img"></div></div></section>
<nav id="types" class="history-tabs" role="tablist" aria-label="กรองประเภทโปรเจกต์">
<button class="history-tab type-tab active" role="tab" aria-selected="true" data-type="all">ทุกประเภท <span id="countTypesAll">0</span></button>
<button class="history-tab type-tab" role="tab" aria-selected="false" data-type="reel">Reels &amp; Video <span id="countReels">0</span></button>
<button class="history-tab type-tab" role="tab" aria-selected="false" data-type="quick-reel">Quick Reel <span id="countQuickReel">0</span></button>
<button class="history-tab type-tab" role="tab" aria-selected="false" data-type="podcast">Podcast <span id="countPodcasts">0</span></button>
<button class="history-tab type-tab" role="tab" aria-selected="false" data-type="zodiac">ดวง 12 ราศี <span id="countZodiac">0</span></button>
</nav>
<nav id="filters" class="history-tabs history-status-tabs" role="tablist" aria-label="กรองสถานะการเผยแพร่">
<button class="history-tab active" role="tab" aria-selected="true" data-filter="all">ทั้งหมด <span id="countAll">0</span></button>
<button class="history-tab" role="tab" aria-selected="false" data-filter="unpublished">ยังไม่เผยแพร่ <span id="countUnpublished">0</span></button>
<button class="history-tab" role="tab" aria-selected="false" data-filter="published">เผยแพร่แล้ว <span id="countPublished">0</span></button>
</nav>
<div class="history-channel-filter"><label for="channelFilter">Channel<select id="channelFilter"><option value="all">ทุก Channel</option></select></label><a class="button secondary small" href="/channels">จัดการ Channel</a></div>
<section id="list" class="history-list" aria-live="polite"></section>
</main><script>
const list=document.querySelector('#list'),statusTabs=[...document.querySelectorAll('[data-filter]')],typeTabs=[...document.querySelectorAll('[data-type]')],channelFilter=document.querySelector('#channelFilter');
const pagePreset=location.pathname==='/reels-history'?'reel':location.pathname==='/quick-reel-history'?'quick-reel':location.pathname==='/podcast-history'?'podcast':null;
const historyFilterStorageKey=`autoclip.history.filters.${pagePreset||'all'}`;
function readHistoryFilters(){try{const value=JSON.parse(localStorage.getItem(historyFilterStorageKey)||'null');return value&&typeof value==='object'?value:{}}catch(_){localStorage.removeItem(historyFilterStorageKey);return {}}}
const savedHistoryFilters=readHistoryFilters();
let projects=[],activeFilter=['all','unpublished','published'].includes(savedHistoryFilters.filter)?savedHistoryFilters.filter:'all',activeType=pagePreset||(['all','reel','quick-reel','podcast','zodiac'].includes(savedHistoryFilters.type)?savedHistoryFilters.type:'all'),activeChannel=savedHistoryFilters.channel||'all';
function saveHistoryFilters(){try{localStorage.setItem(historyFilterStorageKey,JSON.stringify({filter:activeFilter,type:activeType,channel:activeChannel}))}catch(_){}}
function syncHistoryFilterTabs(){statusTabs.forEach(item=>{const active=item.dataset.filter===activeFilter;item.classList.toggle('active',active);item.setAttribute('aria-selected',String(active))});typeTabs.forEach(item=>{const active=item.dataset.type===activeType;item.classList.toggle('active',active);item.setAttribute('aria-selected',String(active))})}
function button(label,href,action){const el=href?document.createElement('a'):document.createElement('button');el.textContent=label;el.className='button secondary';if(href)el.href=href;if(action)el.onclick=action;return el}
function typeMatches(p){return activeType==='all'||(activeType==='zodiac'?['zodiac','zodiac_batch'].includes(p.project_type):p.project_type===activeType)}
function visibleProjects(){return projects.filter(p=>typeMatches(p)&&(activeChannel==='all'||p.channelId===activeChannel)&&(activeFilter==='all'||(activeFilter==='published'?p.published:!p.published)))}
function updateCounts(){const typed=projects.filter(typeMatches);document.querySelector('#countTypesAll').textContent=projects.length;document.querySelector('#countReels').textContent=projects.filter(p=>p.project_type==='reel').length;document.querySelector('#countQuickReel').textContent=projects.filter(p=>p.project_type==='quick-reel').length;document.querySelector('#countPodcasts').textContent=projects.filter(p=>p.project_type==='podcast').length;document.querySelector('#countZodiac').textContent=projects.filter(p=>['zodiac','zodiac_batch'].includes(p.project_type)).length;document.querySelector('#countAll').textContent=typed.length;document.querySelector('#countPublished').textContent=typed.filter(p=>p.published).length;document.querySelector('#countUnpublished').textContent=typed.filter(p=>!p.published).length}
async function setPublished(project,published,control){control.disabled=true;try{const response=await fetch(`/api/history/${encodeURIComponent(project.id)}/published`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({published})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail?.message||'เปลี่ยนสถานะไม่สำเร็จ');project.published=data.published;project.published_at=data.publishedAt;updateCounts();render()}catch(error){alert(error.message)}finally{control.disabled=false}}
function render() { list.replaceChildren(); const items = visibleProjects(); if (!items.length) { const empty = document.createElement("section"); empty.className = "tool-card history-empty"; empty.textContent = projects.length ? "ไม่มีโปรเจกต์ในสถานะนี้" : "ยังไม่มีโปรเจกต์"; list.append(empty); return; } for (const p of items) { const card = document.createElement("section"); card.className = "tool-card history-card"; const info = document.createElement("div"); const jobBadge = document.createElement("span"); jobBadge.className = "eyebrow"; jobBadge.textContent = p.latestJob?.status || p.status; const publishBadge = document.createElement("span"); publishBadge.className = "publish-state" + (p.published ? " published" : ""); publishBadge.textContent = p.published ? "เผยแพร่แล้ว" : "ยังไม่เผยแพร่"; const title = document.createElement("h2"); title.textContent = p.title; const meta = document.createElement("p"); meta.className = "muted"; meta.textContent = `${p.scene_count || 0} scenes · อัปเดต ${new Date(p.updated_at).toLocaleString("th-TH")}${p.published_at ? ` · เผยแพร่ ${new Date(p.published_at).toLocaleString("th-TH")}` : ""}`; info.append(jobBadge, publishBadge, title, meta); if (p.project_type === 'quick-reel' && p.latestJob?.metadata?.videoMetadata) { const vm = p.latestJob.metadata.videoMetadata; const qMetaDiv = document.createElement('div'); qMetaDiv.style.marginTop = '16px'; qMetaDiv.style.padding = '12px'; qMetaDiv.style.background = 'rgba(0,0,0,0.3)'; qMetaDiv.style.borderRadius = '8px'; qMetaDiv.style.border = '1px solid var(--line)'; const qTitleRow = document.createElement('div'); qTitleRow.style.display = 'flex'; qTitleRow.style.justifyContent = 'space-between'; qTitleRow.style.alignItems = 'flex-start'; qTitleRow.style.marginBottom = '8px'; const qTitle = document.createElement('h4'); qTitle.textContent = vm.title || '-'; qTitle.style.margin = '0'; qTitle.style.fontSize = '14px'; qTitle.style.color = 'var(--cyan)'; const qCopyTitle = document.createElement('button'); qCopyTitle.className = 'button small secondary'; qCopyTitle.textContent = 'Copy Title'; qCopyTitle.onclick = () => { navigator.clipboard.writeText(vm.title || ''); qCopyTitle.textContent='Copied!'; setTimeout(()=>qCopyTitle.textContent='Copy Title', 2000); }; qTitleRow.append(qTitle, qCopyTitle); const qDescRow = document.createElement('div'); qDescRow.style.display = 'flex'; qDescRow.style.justifyContent = 'space-between'; qDescRow.style.alignItems = 'flex-end'; qDescRow.style.marginTop = '8px'; const qDescPre = document.createElement('pre'); qDescPre.style.margin = '0'; qDescPre.style.whiteSpace = 'pre-wrap'; qDescPre.style.fontSize = '13px'; qDescPre.style.color = 'var(--soft)'; qDescPre.textContent = vm.description || '-'; const qCopyDesc = document.createElement('button'); qCopyDesc.className = 'button small secondary'; qCopyDesc.textContent = 'Copy Caption'; qCopyDesc.onclick = () => { navigator.clipboard.writeText(vm.description || ''); qCopyDesc.textContent='Copied!'; setTimeout(()=>qCopyDesc.textContent='Copy Caption', 2000); }; qDescRow.append(qDescPre, qCopyDesc); qMetaDiv.append(qTitleRow, qDescRow); info.append(qMetaDiv); } const actions = document.createElement("div"); actions.className = "actions"; if (p.latestJob?.videoAvailable) actions.append( button("ดูวิดีโอ", p.latestJob.previewUrl), button("ดาวน์โหลด MP4", p.latestJob.videoUrl), button("Upload to YouTube", null, () => uploadYtForm(p)), ); else if ( p.latestJob && [ "RECEIVED", "VALIDATING", "GENERATING_AUDIO", "RENDERING_SCENES", "COMPOSING", ].includes(p.latestJob.status) ) actions.append(button("ดูความคืบหน้า", `/jobs/${p.latestJob.id}`)); if (p.latestJob?.englishAudioAvailable) actions.append( button("ดาวน์โหลด English WAV", p.latestJob.englishAudioUrl), ); else if (p.latestJob?.englishAudioStatus === "failed") actions.append( button("Retry English Audio", null, async () => { const response = await fetch( `/api/jobs/${p.latestJob.id}/english-audio/retry`, { method: "POST" }, ); if (!response.ok) { const data = await response.json().catch(() => ({})); alert(data.detail?.message || "เริ่ม Retry ไม่สำเร็จ"); } else { alert("เริ่ม Retry English Audio แล้ว"); load(); } }), ); actions.append( button( p.published ? "เปลี่ยนเป็นยังไม่เผยแพร่" : "ทำเครื่องหมายว่าเผยแพร่แล้ว", null, (event) => setPublished(p, !p.published, event.currentTarget), ), ); actions.append( button("ย้ายไปถังขยะ", null, async () => { if (confirm("ย้ายโปรเจกต์นี้ไปถังขยะหรือไม่?")) { const response = await fetch( "/api/ai/projects/" + encodeURIComponent(p.id), { method: "DELETE" }, ); if (!response.ok) alert("ย้ายโปรเจกต์ไม่สำเร็จ"); else load(); } }), ); card.append(info, actions); list.append(card); }}
async function load(){list.textContent='กำลังโหลดประวัติ…';try{const [historyResponse,channelResponse]=await Promise.all([fetch('/api/history'),fetch('/api/channels')]);if(!historyResponse.ok||!channelResponse.ok)throw new Error();projects=(await historyResponse.json()).projects||[];const channels=(await channelResponse.json()).channels||[];channelFilter.replaceChildren(new Option('ทุก Channel','all'),...channels.map(channel=>new Option(channel.name,channel.id)));if(![...channelFilter.options].some(option=>option.value===activeChannel))activeChannel='all';channelFilter.value=activeChannel;updateCounts();render()}catch(error){list.textContent='โหลด Project History ไม่สำเร็จ กรุณาลองใหม่'}}
statusTabs.forEach(tab=>tab.onclick=()=>{activeFilter=tab.dataset.filter;syncHistoryFilterTabs();saveHistoryFilters();render()});
typeTabs.forEach(tab=>tab.onclick=()=>{activeType=tab.dataset.type;syncHistoryFilterTabs();saveHistoryFilters();updateCounts();render()});
channelFilter.onchange=()=>{activeChannel=channelFilter.value;saveHistoryFilters();render()};
async function uploadYtForm(p){const cr=await fetch('/api/youtube/connections');const cd=await cr.json();if(!(cd.connections||[]).length){if(confirm('ยังไม่มีช่อง YouTube เชื่อมต่อ ต้องการเชื่อมต่อหรือไม่?'))location.href='/api/youtube/connect';return}const dialog=document.createElement('dialog');dialog.innerHTML='<form method="dialog" style="min-width:min(520px,90vw)"><h2>Upload to YouTube</h2><label>Channel<select id="ytc"></select></label><label>Title<input id="ytt" required maxlength="100"></label><label>Description<textarea id="ytd" maxlength="5000"></textarea></label><label>Tags<input id="ytg" placeholder="tag1, tag2"></label><label>Visibility<select id="ytp"><option value="private">Private</option><option value="unlisted">Unlisted</option><option value="public">Public</option></select></label><div class="actions"><button value="cancel">Cancel</button><button id="yts" value="default">Upload</button></div></form>';document.body.append(dialog);const channel=dialog.querySelector('#ytc');cd.connections.forEach(c=>{const option=document.createElement('option');option.value=c.id;option.textContent=c.channel_title;channel.append(option)});const meta=p.latestJob?.metadata?.videoMetadata||{};dialog.querySelector('#ytt').value=(meta.title&&meta.title!=='-')?meta.title:p.title;if(meta.description&&meta.description!=='-')dialog.querySelector('#ytd').value=meta.description;if(meta.tags)dialog.querySelector('#ytg').value=Array.isArray(meta.tags)?meta.tags.join(', '):meta.tags;dialog.querySelector('form').onsubmit=async event=>{event.preventDefault();const submit=dialog.querySelector('#yts');submit.disabled=true;submit.textContent='Uploading…';const response=await fetch('/api/history/'+encodeURIComponent(p.id)+'/youtube/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({connectionId:channel.value,title:dialog.querySelector('#ytt').value,description:dialog.querySelector('#ytd').value,tags:dialog.querySelector('#ytg').value.split(',').map(x=>x.trim()).filter(Boolean),privacyStatus:dialog.querySelector('#ytp').value})});const data=await response.json();submit.disabled=false;submit.textContent='Upload';if(!response.ok)alert((data.detail?.code||'YOUTUBE_UPLOAD_FAILED')+': '+(data.detail?.message||'อัปโหลดไม่สำเร็จ'));else{dialog.close();alert('อัปโหลดสำเร็จ\n'+data.url);load()}};dialog.addEventListener('close',()=>dialog.remove());dialog.showModal()}
const channelBadgeObserver=new MutationObserver(()=>{const visible=visibleProjects();[...document.querySelectorAll('#list .history-card')].forEach((card,index)=>{if(card.querySelector('[data-channel-editor]'))return;const project=visible[index];if(!project)return;const editor=document.createElement('div');editor.dataset.channelEditor='true';editor.className='history-card-channel';const label=document.createElement('label');label.textContent='Channel';const select=document.createElement('select');[...channelFilter.options].filter(option=>option.value!=='all').forEach(option=>select.append(new Option(option.textContent,option.value)));select.value=project.channelId||'undefined';const save=document.createElement('button');save.type='button';save.className='button secondary small';save.textContent='บันทึก Channel';const status=document.createElement('span');status.className='muted';save.onclick=async()=>{save.disabled=true;status.textContent='กำลังบันทึก…';try{const response=await fetch(`/api/history/${encodeURIComponent(project.id)}/channel`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({channelId:select.value})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail?.message||'บันทึก Channel ไม่สำเร็จ');project.channelId=data.channelId;project.channelName=data.channelName;status.textContent=`บันทึกแล้ว: ${data.channelName}`;if(activeChannel!=='all'&&activeChannel!==data.channelId)render()}catch(error){status.textContent=error.message}finally{save.disabled=false}};label.append(select);editor.append(label,save,status);card.querySelector('h2')?.after(editor)})});
channelBadgeObserver.observe(list,{childList:true});
syncHistoryFilterTabs();
load();
</script><script>
const zodiacHistoryObserver=new MutationObserver(()=>{const visible=visibleProjects();[...document.querySelectorAll('#list .history-card')].forEach((card,index)=>{const project=visible[index];if(project?.project_type!=='zodiac_batch'||card.querySelector('[data-open-zodiac]'))return;const actions=card.querySelector('.actions');if(!actions)return;const viewAllLink=button('ดูคลิปทั้งหมด (View All)',`/zodiac-history?batch=${encodeURIComponent(project.id)}&view=all`);viewAllLink.dataset.openZodiac='true';const openLink=button('เปิดชุด 12 ราศี',`/zodiac-weekly?batch=${encodeURIComponent(project.id)}`);openLink.dataset.openZodiac='true';actions.prepend(openLink,viewAllLink)})});
zodiacHistoryObserver.observe(document.querySelector('#list'),{childList:true});
const preset=pagePreset;
if(preset){activeType=preset;syncHistoryFilterTabs();saveHistoryFilters();document.querySelector('#types').hidden=true;const name=preset==='reel'?'Reels History':preset==='quick-reel'?'Quick Reel History':'Podcast History';document.title=`AutoClip · ${name}`;document.querySelector('.hero-card h1').textContent=name;document.querySelector('.hero-card .muted').textContent=preset==='reel'?'งานวิดีโอและ Reels แยกจาก Podcast และคนเหนือดวง':preset==='quick-reel'?'งาน Quick Reel หลายภาพ • เสียงเดียว แยกเป็นเอกเทศ':'งาน Podcast แยกจาก Reels และคนเหนือดวง'}
const historyLink=document.querySelector('.app-nav a[href="/history"]');if(historyLink){for(const [label,href] of [['Reels History','/reels-history'],['Quick Reel History','/quick-reel-history'],['Podcast History','/podcast-history'],['คนเหนือดวง History','/zodiac-history']]){if(!document.querySelector(`.app-nav a[href="${href}"]`)){const link=document.createElement('a');link.href=href;link.textContent=label;if(location.pathname===href)link.className='active';historyLink.before(link)}}if(preset)historyLink.removeAttribute('class')}
</script><script src="/static/nav.js?v=5"></script></body></html>
