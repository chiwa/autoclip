<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoClip · Project History</title><link rel="stylesheet" href="/static/style.css?v=6"></head><body><main><header><a class="brand" href="/">AutoClip</a><nav class="app-nav"><a href="/">สร้างวิดีโอ</a><a href="/ai">สร้างด้วย AI</a><a class="active" href="/history">History</a><a href="/tts">Thai TTS</a></nav></header><section class="tool-card hero-card"><span class="eyebrow">PROJECT HISTORY</span><h1>โปรเจกต์ของคุณ</h1><p class="muted">เปิดดูงานเดิม ดาวน์โหลด ZIP หรือดูวิดีโอที่สร้างเสร็จแล้ว</p></section><section id="list" class="history-list" aria-live="polite"></section></main><script>
const list=document.querySelector('#list');
function button(label,href,action){const el=href?document.createElement('a'):document.createElement('button');el.textContent=label;el.className='button secondary';if(href)el.href=href;if(action)el.onclick=action;return el}
async function load(){list.textContent='กำลังโหลดประวัติ…';try{const r=await fetch('/api/history');if(!r.ok)throw Error();const data=await r.json();list.replaceChildren();if(!data.projects.length){const empty=document.createElement('section');empty.className='tool-card';empty.textContent='ยังไม่มีโปรเจกต์';list.append(empty);return}for(const p of data.projects){const card=document.createElement('section');card.className='tool-card history-card';const info=document.createElement('div');const badge=document.createElement('span');badge.className='eyebrow';badge.textContent=p.latestJob?.status||p.status;const title=document.createElement('h2');title.textContent=p.title;const meta=document.createElement('p');meta.className='muted';meta.textContent=`${p.scene_count||0} scenes · อัปเดต ${new Date(p.updated_at).toLocaleString('th-TH')}`;info.append(badge,title,meta);const actions=document.createElement('div');actions.className='actions';if(p.latestJob?.videoAvailable){actions.append(button('ดูวิดีโอ',p.latestJob.previewUrl),button('ดาวน์โหลด MP4',p.latestJob.videoUrl))}actions.append(button('ย้ายไปถังขยะ',null,async()=>{if(confirm('ย้ายโปรเจกต์นี้ไปถังขยะหรือไม่?')){const response=await fetch('/api/ai/projects/'+encodeURIComponent(p.id),{method:'DELETE'});if(!response.ok)alert('ย้ายโปรเจกต์ไม่สำเร็จ');else load()}}));card.append(info,actions);list.append(card)}}catch(e){list.textContent='โหลด Project History ไม่สำเร็จ กรุณาลองใหม่'}}load();
</script><script>
// YouTube publishing actions are layered onto the existing history renderer.
async function uploadYt(p){const cr=await fetch('/api/youtube/connections');const cd=await cr.json();if(!(cd.connections||[]).length){if(confirm('ยังไม่มีช่อง YouTube เชื่อมต่อ ต้องการเชื่อมต่อหรือไม่?'))location.href='/api/youtube/connect';return}const title=prompt('ชื่อวิดีโอ',p.title);if(!title)return;const privacy=prompt('Visibility: private, unlisted หรือ public','private');if(!privacy)return;const r=await fetch('/api/history/'+encodeURIComponent(p.id)+'/youtube/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({connectionId:cd.connections[0].id,title,description:'',tags:['Mamase'],privacyStatus:privacy})});const d=await r.json();if(!r.ok)alert((d.detail?.code||'YOUTUBE_UPLOAD_FAILED')+': '+(d.detail?.message||'อัปโหลดไม่สำเร็จ'));else alert('อัปโหลดสำเร็จ\n'+d.url)}
(async()=>{try{const r=await fetch('/api/history');const d=await r.json();const cards=[...document.querySelectorAll('.history-card')];for(const [i,p] of d.projects.entries()){if(!p.latestJob?.videoAvailable||!cards[i])continue;const b=document.createElement('button');b.className='button secondary';b.textContent='Upload to YouTube';b.onclick=()=>uploadYtForm(p);cards[i].querySelector('.actions')?.append(b)}}catch(e){console.warn('YouTube actions unavailable')}})();
async function uploadYtForm(p){const cr=await fetch('/api/youtube/connections');const cd=await cr.json();if(!(cd.connections||[]).length){if(confirm('ยังไม่มีช่อง YouTube เชื่อมต่อ ต้องการเชื่อมต่อหรือไม่?'))location.href='/api/youtube/connect';return}const dialog=document.createElement('dialog');dialog.innerHTML='<form method="dialog" style="min-width:min(520px,90vw)"><h2>Upload to YouTube</h2><label>Channel<select id="ytc"></select></label><label>Title<input id="ytt" required maxlength="100"></label><label>Description<textarea id="ytd" maxlength="5000"></textarea></label><label>Tags<input id="ytg" placeholder="tag1, tag2"></label><label>Visibility<select id="ytp"><option value="private">Private</option><option value="unlisted">Unlisted</option><option value="public">Public</option></select></label><div class="actions"><button value="cancel">Cancel</button><button id="yts" value="default">Upload</button></div></form>';document.body.append(dialog);const f=dialog.querySelector('#ytc');cd.connections.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.channel_title;f.append(o)});dialog.querySelector('#ytt').value=p.title;dialog.querySelector('form').onsubmit=async e=>{e.preventDefault();const b=dialog.querySelector('#yts');b.disabled=true;b.textContent='Uploading…';const r=await fetch('/api/history/'+encodeURIComponent(p.id)+'/youtube/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({connectionId:f.value,title:dialog.querySelector('#ytt').value,description:dialog.querySelector('#ytd').value,tags:dialog.querySelector('#ytg').value.split(',').map(x=>x.trim()).filter(Boolean),privacyStatus:dialog.querySelector('#ytp').value})});const d=await r.json();b.disabled=false;b.textContent='Upload';if(!r.ok)alert((d.detail?.code||'YOUTUBE_UPLOAD_FAILED')+': '+(d.detail?.message||'อัปโหลดไม่สำเร็จ'));else{dialog.close();alert('อัปโหลดสำเร็จ\n'+d.url)}};dialog.addEventListener('close',()=>dialog.remove());dialog.showModal()}
</script></body></html>
