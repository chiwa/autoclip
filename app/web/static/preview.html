<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoClip · Video Preview</title><link rel="icon" type="image/png" href="/static/auto-clip-logo.png"><link rel="stylesheet" href="/static/style.css?v=24"></head>
<body><main class="preview"><header><a class="brand" href="/"><img class="brand-logo" src="/static/auto-clip-logo.png" alt="AutoClip Logo">AutoClip</a></header><section id="previewLoading"><p>กำลังโหลดตัวอย่างวิดีโอ…</p></section>
<section id="previewContent" hidden><h1 class="success-title">สร้างวิดีโอสำเร็จ ✓</h1><video id="video" controls playsinline preload="metadata"></video><h2 id="projectTitle"></h2><dl id="metadata" class="metadata"></dl><section id="channelCard" class="tool-card publication-card"><span class="eyebrow">CONTENT CHANNEL</span><h2>Channel</h2><div id="previewChannelPicker"></div><p id="channelStatus" class="muted" aria-live="polite"></p><button id="saveChannel" type="button" class="button secondary">บันทึก Channel</button></section><section id="publicationCard" class="tool-card publication-card"><span class="eyebrow">PUBLISH STATUS</span><h2>สถานะการเผยแพร่</h2><p id="publicationStatus" class="muted">กำลังตรวจสอบสถานะ…</p><button id="publicationToggle" type="button" class="button secondary" disabled>มาร์กว่า Publish แล้ว</button></section><div class="actions"><a id="download" class="button" download>ดาวน์โหลด MP4 (Download MP4)</a><a class="button secondary" href="/">สร้างวิดีโออีกครั้ง (Generate Another Video)</a></div></section>
<div id="previewError" class="error" hidden></div></main><script src="/static/nav.js?v=5"></script><script src="/static/channels.js?v=1"></script><script src="/static/preview.js?v=10"></script></body></html>
