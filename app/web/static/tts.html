<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoClip · Thai TTS</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><header><a class="brand" href="/">AutoClip</a><p class="lead">Text to Speech ภาษาไทย</p></header>
<section class="tool-card"><label>ข้อความภาษาไทย<textarea id="text" rows="8" maxlength="2000" placeholder="พิมพ์ข้อความที่ต้องการให้พูด"></textarea></label>
<div class="tts-options"><label>Engine<select id="provider"><option value="kokoro-thai" selected>Wayu Kokoro Thai</option><option value="local">Vachana Thai</option><option value="dummy">Dummy (ทดสอบ)</option></select></label><label>เสียง<select id="voice"><option value="m_young_clear">ผู้ชายวัยหนุ่ม · ชัดเจน</option><option value="m_mid_warm">ผู้ชายวัยกลางคน · อบอุ่น</option><option value="m_elderly_deep">ผู้ชายสูงวัย · ทุ้มลึก</option><option value="m_teen_bright">ผู้ชายวัยรุ่น · สดใส</option><option value="f_young_clear">ผู้หญิงวัยหนุ่มสาว · ชัดเจน</option><option value="f_young_warm">ผู้หญิงวัยหนุ่มสาว · อบอุ่น</option><option value="f_young_bright">ผู้หญิงวัยหนุ่มสาว · สดใส</option><option value="f_mid_clear">ผู้หญิงวัยกลางคน · ชัดเจน</option><option value="f_mid_warm">ผู้หญิงวัยกลางคน · อบอุ่น</option><option value="f_elderly_soft">ผู้หญิงสูงวัย · นุ่มนวล</option><option value="f_elderly_low">ผู้หญิงสูงวัย · ทุ้มต่ำ</option><option value="f_teen_bright">ผู้หญิงวัยรุ่น · สดใส</option></select><button id="previewVoice" type="button" class="secondary" style="margin-top:8px">ฟังเสียงที่เลือก</button><span id="previewVoiceStatus" class="muted"></span></label><label>ความเร็ว<input id="speed" type="number" min="0.5" max="2" step="0.05" value="1"></label></div>
<button id="go">สร้างเสียง</button><span id="status" class="muted"></span><div id="result" hidden><audio id="audio" controls></audio><a id="download" class="button secondary" download="autoclip-thai-speech.wav">ดาวน์โหลด WAV</a></div></section></main>
<script src="/static/nav.js"></script><script>
let url; const synthesize=async(text,status,result)=>{const body=new FormData();body.append('text',text);body.append('voice',document.querySelector('#voice').value);body.append('speed',document.querySelector('#speed').value);body.append('provider',document.querySelector('#provider').value);const r=await fetch('/api/tts',{method:'POST',body});if(!r.ok)throw await r.json();if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(await r.blob());if(result){document.querySelector('#audio').src=url;document.querySelector('#download').href=url;result.hidden=false}status.textContent='สร้างเสียงสำเร็จ'};document.querySelector('#previewVoice').onclick=async()=>{const b=document.querySelector('#previewVoice'),s=document.querySelector('#previewVoiceStatus'),result=document.querySelector('#result');b.disabled=true;s.textContent='กำลังสร้างเสียงตัวอย่าง…';try{await synthesize('สวัสดีครับ สบายดีไหมครับ',s,result);const audio=document.querySelector('#audio');audio.hidden=false;await audio.play();s.textContent='กำลังเล่นเสียงตัวอย่าง'}catch(e){s.textContent=(e.detail?.code||'TTS_GENERATION_FAILED')+': '+(e.detail?.message||'สร้างเสียงไม่สำเร็จ')}finally{b.disabled=false}};document.querySelector('#go').onclick=async()=>{const text=document.querySelector('#text').value.trim(),status=document.querySelector('#status'),result=document.querySelector('#result');if(!text){status.textContent='กรุณาป้อนข้อความ';return}document.querySelector('#go').disabled=true;status.textContent='กำลังสร้างเสียง…';try{await synthesize(text,status,result)}catch(e){status.textContent=(e.detail?.code||'TTS_GENERATION_FAILED')+': '+(e.detail?.message||'สร้างเสียงไม่สำเร็จ')}finally{document.querySelector('#go').disabled=false}};
</script><script>
(() => {
  const provider = document.querySelector('#provider');
  const voice = document.querySelector('#voice');
  const providerLabel = provider.closest('label');
  const voiceLabel = voice.closest('label');
  const choices = {
    'kokoro-thai': [
      ['m_young_clear', 'ผู้ชายวัยหนุ่ม · ชัดเจน (แนะนำ)'], ['m_mid_warm', 'ผู้ชายวัยกลางคน · อบอุ่น'],
      ['m_elderly_deep', 'ผู้ชายสูงวัย · ทุ้มลึก'], ['m_teen_bright', 'ผู้ชายวัยรุ่น · สดใส'],
      ['f_young_clear', 'ผู้หญิงวัยหนุ่มสาว · ชัดเจน'], ['f_young_warm', 'ผู้หญิงวัยหนุ่มสาว · อบอุ่น'],
      ['f_young_bright', 'ผู้หญิงวัยหนุ่มสาว · สดใส'], ['f_mid_clear', 'ผู้หญิงวัยกลางคน · ชัดเจน'],
      ['f_mid_warm', 'ผู้หญิงวัยกลางคน · อบอุ่น'], ['f_elderly_soft', 'ผู้หญิงสูงวัย · นุ่มนวล'],
      ['f_elderly_low', 'ผู้หญิงสูงวัย · ทุ้มต่ำ'], ['f_teen_bright', 'ผู้หญิงวัยรุ่น · สดใส'],
    ],
    local: [['thai-male-01', 'ผู้ชาย · Vachana Thai'], ['thai-female-01', 'ผู้หญิง · Vachana Thai'], ['thai-male-02', 'ผู้ชาย · Vachana Thai 2'], ['thai-female-02', 'ผู้หญิง · Vachana Thai 2']],
    dummy: [['thai-male-01', 'เสียงทดสอบ']],
  };
  function updateVoiceChoices() {
    const active = provider.value;
    voice.replaceChildren(...(choices[active] || choices['kokoro-thai']).map(([value, label]) => {
      const option = document.createElement('option'); option.value = value; option.textContent = label; return option;
    }));
    providerLabel.childNodes[0].textContent = 'ระบบสร้างเสียง';
    voiceLabel.childNodes[0].textContent = active === 'kokoro-thai' ? 'เสียง Kokoro Thai' : active === 'local' ? 'เสียง Vachana Thai' : 'เสียงทดสอบ';
  }
  provider.addEventListener('change', updateVoiceChoices);
  updateVoiceChoices();
})();
</script></body></html>
