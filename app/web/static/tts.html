Keep the delivery flowing and connected, with a medium-fast pace and clear pronunciation. Maintain forward momentum throughout each sentence. Use brief pauses only when they help comprehension or set up a genuinely surprising moment.

const mamaseStyle=`Read aloud in a natural, lively, conversational Thai voice. Sound confident, friendly, and slightly cheeky, like a charismatic Thai creator casually sharing a fascinating discovery with a close friend.

Keep the delivery flowing and connected, with a medium-fast pace and clear pronunciation. Maintain forward momentum throughout each sentence. Use brief pauses only when they help comprehension or set up a genuinely surprising moment.

Vary pitch and rhythm naturally, with a subtle smile in the voice. Give surprising facts a spontaneous, amused reaction, as if thinking: "เฮ้ย... จริงดิ?" Emphasize important words briefly through tone, not by stretching syllables or slowing down.

Avoid slow openings, drawn-out words, long dramatic pauses, sleepy pacing, excessive emphasis, and perfectly even sentence timing. Never sound like a news presenter, announcer, formal narrator, advertisement, or someone reading from a script.

Overall personality: friendly, curious, clever, playful, charming, energetic, and easy to listen to—lively without shouting, expressive without becoming theatrical.`;let url; const synthesize=async(text,status,result)=>{const body=new FormData();body.append('text',text);body.append('voice',document.querySelector('#voice').value);body.append('speed',document.querySelector('#speed').value);body.append('provider',document.querySelector('#provider').value);body.append('style_prompt',document.querySelector('#stylePrompt').value);const r=await fetch('/api/tts',{method:'POST',body});if(!r.ok)throw await r.json();if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(await r.blob());if(result){document.querySelector('#audio').src=url;document.querySelector('#download').href=url;result.hidden=false}status.textContent='สร้างเสียงสำเร็จ'};document.querySelector('#resetMamaseStyle').onclick=()=>{document.querySelector('#stylePrompt').value=mamaseStyle;document.querySelector('#speed').value='1';document.querySelector('#provider').value='google-gemini';document.querySelector('#provider').dispatchEvent(new Event('change'));};document.querySelector('#previewVoice').onclick=async()=>{const b=document.querySelector('#previewVoice'),s=document.querySelector('#previewVoiceStatus'),result=document.querySelector('#result');b.disabled=true;s.textContent='กำลังสร้างเสียงตัวอย่าง…';try{await synthesize('ใต้พื้นน้ำแข็งอาจมีมหาสมุทรทั้งใบซ่อนอยู่ เฮ้ย... จริงดิ? นี่แหละครับ เรื่องน่าทึ่งของเอนเซลาดัส',s,result);const audio=document.querySelector('#audio');audio.hidden=false;await audio.play();s.textContent='กำลังเล่นเสียงตัวอย่าง'}catch(e){s.textContent=(e.detail?.code||'TTS_GENERATION_FAILED')+': '+(e.detail?.message||'สร้างเสียงไม่สำเร็จ')}finally{b.disabled=false}};document.querySelector('#go').onclick=async()=>{const text=document.querySelector('#text').value.trim(),status=document.querySelector('#status'),result=document.querySelector('#result');if(!text){status.textContent='กรุณาป้อนข้อความ';return}document.querySelector('#go').disabled=true;status.textContent='กำลังสร้างเสียง…';try{await synthesize(text,status,result)}catch(e){status.textContent=(e.detail?.code||'TTS_GENERATION_FAILED')+': '+(e.detail?.message||'สร้างเสียงไม่สำเร็จ')}finally{document.querySelector('#go').disabled=false}};
</script><script>
(() => {
  const provider = document.querySelector('#provider');
  const voice = document.querySelector('#voice');
  const providerLabel = provider.closest('label');
  const voiceLabel = voice.closest('label');
  const choices = {
    'google-gemini': [['Fenrir', 'Fenrir · Mamase (ขี้เล่น เป็นธรรมชาติ)'], ['Enceladus', 'Enceladus'], ['Alnilam', 'Alnilam'], ['Charon', 'Charon'], ['Iapetus', 'Iapetus'], ['Orus', 'Orus']],
    'kokoro-thai': [
      ['m_young_clear', 'ผู้ชายวัยหนุ่ม · ชัดเจน (แนะนำ)'], ['m_mid_warm', 'ผู้ชายวัยกลางคน · อบอุ่น'],
      ['m_elderly_deep', 'ผู้ชายสูงวัย · ทุ้มลึก'], ['m_teen_bright', 'ผู้ชายวัยรุ่น · สดใส'],
      ['f_young_clear', 'ผู้หญิงวัยหนุ่มสาว · ชัดเจน'], ['f_young_warm', 'ผู้หญิงวัยหนุ่มสาว · อบอุ่น'],
      ['f_young_bright', 'ผู้หญิงวัยหนุ่มสาว · สดใส'], ['f_mid_clear', 'ผู้หญิงวัยกลางคน · ชัดเจน'],
      ['f_mid_warm', 'ผู้หญิงวัยกลางคน · อบอุ่น'], ['f_elderly_soft', 'ผู้หญิงสูงวัย · นุ่มนวล'],
      ['f_elderly_low', 'ผู้หญิงสูงวัย · ทุ้มต่ำ'], ['f_teen_bright', 'ผู้หญิงวัยรุ่น · สดใส'],
    ],
    local: [['thai-male-01', 'ผู้ชาย · Vachana Thai'], ['thai-female-01', 'ผู้หญิง · Vachana Thai'], ['thai-male-02', 'ผู้ชาย · Vachana Thai 2'], ['thai-female-02', 'ผู้หญิง · Vachana Thai 2']],
    dummy: [['thai-male-01', 'เสียงทดสอบ']],
  };
  function updateVoiceChoices() {
    const active = provider.value;
    voice.replaceChildren();
    const addOptions = (parent, items) => items.forEach(([value, label]) => { const option = document.createElement('option'); option.value = value; option.textContent = label; parent.append(option); });
    if (active === 'google-gemini') {
      const male = document.createElement('optgroup'); male.label = 'ชาย'; addOptions(male, choices['google-gemini']);
      const female = document.createElement('optgroup'); female.label = 'หญิง'; addOptions(female, [['Achernar','Achernar'],['Aoede','Aoede'],['Autonoe','Autonoe'],['Callirrhoe','Callirrhoe'],['Despina','Despina'],['Erinome','Erinome'],['Gacrux','Gacrux'],['Kore','Kore'],['Leda','Leda']]);
      voice.append(male, female); voice.value = 'Fenrir';
    } else { addOptions(voice, choices[active] || choices['google-gemini']); }
    providerLabel.childNodes[0].textContent = 'ระบบสร้างเสียง';
    voiceLabel.childNodes[0].textContent = active === 'google-gemini' ? 'เสียง Google Gemini' : active === 'kokoro-thai' ? 'เสียง Kokoro Thai' : active === 'local' ? 'เสียง Vachana Thai' : 'เสียงทดสอบ';
  }
  provider.addEventListener('change', updateVoiceChoices);
  updateVoiceChoices();
})();
</script><script>document.querySelector('#speed').value='1';document.querySelector('#speedValue').textContent='1.00';document.querySelector('#speed').addEventListener('input',event=>{document.querySelector('#speedValue').textContent=Number(event.target.value).toFixed(2)});document.querySelector('#resetMamaseStyle').addEventListener('click',()=>{document.querySelector('#speed').value='1';document.querySelector('#speedValue').textContent='1.00'});const metrics=document.createElement('a');metrics.className='button secondary';metrics.target='_blank';metrics.rel='noopener';metrics.href='https://console.cloud.google.com/apis/api/aiplatform.googleapis.com/metrics?project=project-b25038eb-bdea-4d70-b72';metrics.textContent='ดู Google Gemini TTS usage / quota';document.querySelector('#resetMamaseStyle').after(metrics);</script></body></html>
