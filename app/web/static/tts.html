<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoClip · Thai TTS</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><header><a class="brand" href="/">AutoClip</a><p class="lead">Text to Speech ภาษาไทย</p></header>
<section class="tool-card"><label>ข้อความภาษาไทย<textarea id="text" rows="8" maxlength="2000" placeholder="พิมพ์ข้อความที่ต้องการให้พูด">คุณเชื่อไหมครับ... ว่าจักรวาลมีเรื่องแปลกกว่าที่เราคิดไว้เยอะมาก แต่เดี๋ยวก่อน... วันนี้เราจะค่อย ๆ ไปค้นพบด้วยกันครับ</textarea></label>
<div class="tts-options"><label>Engine<select id="provider"><option value="google-gemini" selected>Google Gemini TTS — Fenrir (Mamase default)</option><option value="kokoro-thai">Wayu Kokoro Thai</option><option value="local">Vachana Thai</option><option value="dummy">Dummy (ทดสอบ)</option></select></label><label>เสียง<select id="voice"><option value="Fenrir">Fenrir · Mamase</option></select><button id="previewVoice" type="button" class="secondary" style="margin-top:8px">ฟังเสียงที่เลือก</button><span id="previewVoiceStatus" class="muted"></span></label><label>ความเร็ว<input id="speed" type="range" min="0.5" max="2" step="0.05" value="1"><output id="speedValue">1.00</output></label></div><label>สไตล์การเล่า<textarea id="stylePrompt" rows="5">Read aloud like a charismatic science storyteller with a playful personality. Sound curious, friendly, slightly cheeky, and genuinely excited by surprising facts. Keep the delivery natural and conversational, with small pauses for comedic timing and emphasis. Never sound like a news anchor.</textarea></label><button id="resetMamaseStyle" type="button" class="secondary">คืนค่า Mamase default</button>
<button id="go">สร้างเสียง</button><span id="status" class="muted"></span><div id="result" hidden><audio id="audio" controls></audio><a id="download" class="button secondary" download="autoclip-thai-speech.wav">ดาวน์โหลด WAV</a></div></section></main>
<script src="/static/nav.js"></script><script>
const mamaseStyle='Read aloud like a charismatic science storyteller with a playful personality. Sound curious, friendly, slightly cheeky, and genuinely excited by surprising facts. Keep the delivery natural and conversational, with small pauses for comedic timing and emphasis. Never sound like a news anchor.';let url; const synthesize=async(text,status,result)=>{const body=new FormData();body.append('text',text);body.append('voice',document.querySelector('#voice').value);body.append('speed',document.querySelector('#speed').value);body.append('provider',document.querySelector('#provider').value);body.append('style_prompt',document.querySelector('#stylePrompt').value);const r=await fetch('/api/tts',{method:'POST',body});if(!r.ok)throw await r.json();if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(await r.blob());if(result){document.querySelector('#audio').src=url;document.querySelector('#download').href=url;result.hidden=false}status.textContent='สร้างเสียงสำเร็จ'};document.querySelector('#resetMamaseStyle').onclick=()=>{document.querySelector('#stylePrompt').value=mamaseStyle;document.querySelector('#speed').value='1';document.querySelector('#provider').value='google-gemini';document.querySelector('#provider').dispatchEvent(new Event('change'));};document.querySelector('#previewVoice').onclick=async()=>{const b=document.querySelector('#previewVoice'),s=document.querySelector('#previewVoiceStatus'),result=document.querySelector('#result');b.disabled=true;s.textContent='กำลังสร้างเสียงตัวอย่าง…';try{await synthesize('คุณเชื่อไหมครับ... ว่าจักรวาลมีเรื่องแปลกกว่าที่เราคิดไว้เยอะมาก แต่เดี๋ยวก่อน... วันนี้เราจะค่อย ๆ ไปค้นพบด้วยกันครับ',s,result);const audio=document.querySelector('#audio');audio.hidden=false;await audio.play();s.textContent='กำลังเล่นเสียงตัวอย่าง'}catch(e){s.textContent=(e.detail?.code||'TTS_GENERATION_FAILED')+': '+(e.detail?.message||'สร้างเสียงไม่สำเร็จ')}finally{b.disabled=false}};document.querySelector('#go').onclick=async()=>{const text=document.querySelector('#text').value.trim(),status=document.querySelector('#status'),result=document.querySelector('#result');if(!text){status.textContent='กรุณาป้อนข้อความ';return}document.querySelector('#go').disabled=true;status.textContent='กำลังสร้างเสียง…';try{await synthesize(text,status,result)}catch(e){status.textContent=(e.detail?.code||'TTS_GENERATION_FAILED')+': '+(e.detail?.message||'สร้างเสียงไม่สำเร็จ')}finally{document.querySelector('#go').disabled=false}};
</script><script>
(() => {
  const provider = document.querySelector('#provider');
  const voice = document.querySelector('#voice');
  const providerLabel = provider.closest('label');
  const voiceLabel = voice.closest('label');
  const choices = {
    'google-gemini': [['Fenrir', 'Fenrir · Mamase (กระฉับกระเฉง เป็นกันเอง)'], ['Alnilam', 'Alnilam'], ['Charon', 'Charon'], ['Enceladus', 'Enceladus'], ['Iapetus', 'Iapetus'], ['Orus', 'Orus']],
    'kokoro-thai': [
      ['m_young_clear', 'ผู้ชายวัยหนุ่ม · ชัดเจน (แนะนำ)'], ['m_mid_warm', 'ผู้ชายวัยกลางคน · อบอุ่น'],
      ['m_elderly_deep', 'ผู้ชายสูงวัย · ทุ้มลึก'], ['m_teen_bright', 'ผู้ชายวัยรุ่น · สดใส'],
      ['f_young_clear', 'ผู้หญิงวัยหนุ่มสาว · ชัดเจน'], ['f_young_warm', 'ผู้หญิงวัยหนุ่มสาว · อบอุ่น'],
      ['f_young_bright', 'ผู้หญิงวัยหนุ่มสาว · สดใส'], ['f_mid_clear', 'ผู้หญิงวัยกลางคน · ชัดเจน'],
      ['f_mid_warm', 'ผู้หญิงวัยกลางคน · อบอุ่น'], ['f_elderly_soft', 'ผู้หญิงสูงวัย · นุ่มนวล'],
      ['f_elderly_low', 'ผู้หญิงสูงวัย · ทุ้มต่ำ'], ['f_teen_bright', 'ผู้หญิงวัยรุ่น · สดใส'],
    ],
    local: [['thai-male-01', 'ผู้ชาย · Vachana Thai'], ['thai-female-01', 'ผู้หญิง · Vachana Thai'], ['thai-male-02', 'ผู้ชาย · Vachana Thai 2'], ['thai-female-02', 'ผู้หญิง · Vachana Thai 2']],
    dummy: [['thai-male-01', 'เสียงทดสอบ']],
  };
  function updateVoiceChoices() {
    const active = provider.value;
    voice.replaceChildren();
    const addOptions = (parent, items) => items.forEach(([value, label]) => { const option = document.createElement('option'); option.value = value; option.textContent = label; parent.append(option); });
    if (active === 'google-gemini') {
      const male = document.createElement('optgroup'); male.label = 'ชาย'; addOptions(male, choices['google-gemini']);
      const female = document.createElement('optgroup'); female.label = 'หญิง'; addOptions(female, [['Achernar','Achernar'],['Aoede','Aoede'],['Autonoe','Autonoe'],['Callirrhoe','Callirrhoe'],['Despina','Despina'],['Erinome','Erinome'],['Gacrux','Gacrux'],['Kore','Kore'],['Leda','Leda']]);
      voice.append(male, female); voice.value = 'Fenrir';
    } else { addOptions(voice, choices[active] || choices['google-gemini']); }
    providerLabel.childNodes[0].textContent = 'ระบบสร้างเสียง';
    voiceLabel.childNodes[0].textContent = active === 'google-gemini' ? 'เสียง Google Gemini' : active === 'kokoro-thai' ? 'เสียง Kokoro Thai' : active === 'local' ? 'เสียง Vachana Thai' : 'เสียงทดสอบ';
  }
  provider.addEventListener('change', updateVoiceChoices);
  updateVoiceChoices();
})();
</script><script>document.querySelector('#speed').value='1.3';document.querySelector('#speedValue').textContent='1.30';document.querySelector('#speed').addEventListener('input',event=>{document.querySelector('#speedValue').textContent=Number(event.target.value).toFixed(2)});document.querySelector('#resetMamaseStyle').addEventListener('click',()=>{document.querySelector('#speed').value='1.3';document.querySelector('#speedValue').textContent='1.30'});const metrics=document.createElement('a');metrics.className='button secondary';metrics.target='_blank';metrics.rel='noopener';metrics.href='https://console.cloud.google.com/apis/api/aiplatform.googleapis.com/metrics?project=project-b25038eb-bdea-4d70-b72';metrics.textContent='ดู Google Gemini TTS usage / quota';document.querySelector('#resetMamaseStyle').after(metrics);</script></body></html>
