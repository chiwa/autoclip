<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoClip · Thai TTS</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><header><a class="brand" href="/">AutoClip</a><p class="lead">Text to Speech ภาษาไทย</p></header>
<section class="tool-card"><label>ข้อความภาษาไทย<textarea id="text" rows="8" maxlength="2000" placeholder="พิมพ์ข้อความที่ต้องการให้พูด"></textarea></label>
<div class="tts-options"><label>Engine<select id="provider"><option value="bird-f5" selected>Bird F5-TTS-THAI (แนะนำ)</option><option value="local">Vachana Thai</option><option value="thonburian">Thonburian F5</option><option value="dummy">Dummy (ทดสอบ)</option></select></label><label>เสียง<select id="voice"><option value="thai-male-01">ผู้ชาย 1</option><option value="thai-female-01">ผู้หญิง 1</option><option value="thai-male-02">ผู้ชาย 2</option><option value="thai-female-02">ผู้หญิง 2</option></select></label><label>ความเร็ว<input id="speed" type="number" min="0.5" max="2" step="0.1" value="1"></label></div>
<button id="go">สร้างเสียง</button><span id="status" class="muted"></span><div id="result" hidden><audio id="audio" controls></audio><a id="download" class="button secondary" download="autoclip-thai-speech.wav">ดาวน์โหลด WAV</a></div></section></main>
<script src="/static/nav.js"></script><script>const khanomtanOption=document.createElement('option');khanomtanOption.value='khanomtan';khanomtanOption.textContent='KhanomTan TTS (ทดลอง)';document.querySelector('#provider')?.append(khanomtanOption);
let url; document.querySelector('#go').onclick=async()=>{const text=document.querySelector('#text').value.trim(),status=document.querySelector('#status'),result=document.querySelector('#result');if(!text){status.textContent='กรุณาป้อนข้อความ';return}document.querySelector('#go').disabled=true;status.textContent='กำลังสร้างเสียง…';const body=new FormData();body.append('text',text);body.append('voice',document.querySelector('#voice').value);body.append('speed',document.querySelector('#speed').value);body.append('provider',document.querySelector('#provider').value);try{const r=await fetch('/api/tts',{method:'POST',body});if(!r.ok)throw await r.json();if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(await r.blob());document.querySelector('#audio').src=url;document.querySelector('#download').href=url;result.hidden=false;status.textContent='สร้างเสียงสำเร็จ'}catch(e){status.textContent=(e.detail?.code||'TTS_GENERATION_FAILED')+': '+(e.detail?.message||'สร้างเสียงไม่สำเร็จ')}finally{document.querySelector('#go').disabled=false}};
</script></body></html>
