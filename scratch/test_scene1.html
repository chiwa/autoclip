<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1920px;
    background: radial-gradient(circle at 50% 35%, #182234 0%, #0c1017 65%, #06080c 100%);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    position: relative;
    color: #e2e8f0;
  }
  /* Background subtle grid & acoustic felt wall texture */
  .bg-texture {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: 
      linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(circle at 50% 40%, black 30%, transparent 80%);
  }
  /* Ambient studio glow behind monitor */
  .ambient-glow {
    position: absolute;
    top: 280px;
    left: 50%;
    transform: translateX(-50%);
    width: 850px;
    height: 600px;
    background: radial-gradient(ellipse at center, rgba(56, 189, 248, 0.12) 0%, rgba(30, 58, 138, 0.08) 50%, transparent 75%);
    filter: blur(50px);
  }
  /* Main workspace container */
  .workspace {
    position: absolute;
    top: 220px;
    left: 50%;
    transform: translateX(-50%);
    width: 960px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  /* Monitor */
  .monitor-frame {
    width: 940px;
    height: 720px;
    background: #0f141c;
    border-radius: 20px;
    padding: 14px;
    box-shadow: 
      0 40px 80px -20px rgba(0, 0, 0, 0.85),
      0 0 0 1px rgba(255, 255, 255, 0.08),
      0 0 30px rgba(56, 189, 248, 0.05);
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .monitor-screen {
    flex: 1;
    background: #090d14;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    border: 1px solid rgba(255, 255, 255, 0.04);
  }
  /* Left IDE sidebar */
  .ide-sidebar {
    width: 220px;
    background: #0d121c;
    border-right: 1px solid rgba(255, 255, 255, 0.05);
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .file-tree-item {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .file-icon {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    background: #38bdf8;
    opacity: 0.8;
  }
  .file-bar {
    height: 8px;
    border-radius: 4px;
    background: #334155;
  }
  /* Editor main area */
  .ide-editor {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .editor-tabs {
    height: 42px;
    background: #0a0f18;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 8px;
  }
  .editor-tab {
    height: 30px;
    width: 130px;
    background: #111827;
    border-radius: 6px 6px 0 0;
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-bottom: none;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 8px;
  }
  .editor-code {
    flex: 1;
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .code-line {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .line-no {
    width: 28px;
    height: 8px;
    background: #1e293b;
    border-radius: 4px;
    margin-right: 12px;
  }
  .token-kw { height: 9px; width: 60px; background: #c084fc; border-radius: 4px; }
  .token-fn { height: 9px; width: 90px; background: #60a5fa; border-radius: 4px; }
  .token-type { height: 9px; width: 75px; background: #34d399; border-radius: 4px; }
  .token-var { height: 9px; width: 50px; background: #f472b6; border-radius: 4px; }
  .token-val { height: 9px; width: 70px; background: #fbbf24; border-radius: 4px; }
  .token-cm { height: 9px; width: 140px; background: #475569; border-radius: 4px; }
  .indent-1 { margin-left: 24px; }
  .indent-2 { margin-left: 48px; }
  .indent-3 { margin-left: 72px; }

  /* Right pane: Architecture / Execution Inspector */
  .ide-right-pane {
    width: 280px;
    background: #0b0f17;
    border-left: 1px solid rgba(255, 255, 255, 0.05);
    padding: 24px 18px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .stat-card {
    background: #111722;
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 10px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .sparkline {
    height: 48px;
    width: 100%;
    background: linear-gradient(180deg, rgba(56, 189, 248, 0.15) 0%, rgba(56, 189, 248, 0) 100%);
    border-bottom: 2px solid #38bdf8;
    border-radius: 4px;
    position: relative;
    overflow: hidden;
  }

  /* Monitor Stand */
  .monitor-neck {
    width: 60px;
    height: 70px;
    background: linear-gradient(90deg, #1e2530 0%, #2a3443 50%, #1e2530 100%);
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    border-radius: 4px;
  }
  .monitor-base {
    width: 260px;
    height: 14px;
    background: linear-gradient(180deg, #2d3748 0%, #1a202c 100%);
    border-radius: 8px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.6);
  }

  /* Desk Mat & Accessories */
  .desk-surface {
    width: 1040px;
    height: 380px;
    margin-top: 20px;
    background: linear-gradient(180deg, #141a24 0%, #0f141c 100%);
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.04);
    box-shadow: 
      0 30px 60px -10px rgba(0, 0, 0, 0.9),
      inset 0 1px 1px rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    padding: 30px;
  }
  .keyboard {
    width: 520px;
    height: 200px;
    background: #0d1117;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.06);
    box-shadow: 0 15px 30px rgba(0,0,0,0.7);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .kb-row {
    display: flex;
    gap: 6px;
    flex: 1;
  }
  .key {
    flex: 1;
    background: #18202c;
    border-radius: 4px;
    box-shadow: 0 2px 0 #0f141d;
  }
  .key.space { flex: 4; }
  .key.mod { background: #222d3d; }

  .mouse {
    width: 80px;
    height: 140px;
    background: linear-gradient(180deg, #1e2634 0%, #131922 100%);
    border-radius: 40px;
    box-shadow: 0 15px 25px rgba(0,0,0,0.6);
    border: 1px solid rgba(255, 255, 255, 0.06);
  }
  .desk-lamp-glow {
    position: absolute;
    right: 40px;
    top: 600px;
    width: 320px;
    height: 500px;
    background: radial-gradient(ellipse at 80% 20%, rgba(251, 191, 36, 0.08) 0%, transparent 60%);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="bg-texture"></div>
  <div class="ambient-glow"></div>
  <div class="desk-lamp-glow"></div>

  <div class="workspace">
    <div class="monitor-frame">
      <div class="monitor-screen">
        <div class="ide-sidebar">
          <div class="file-tree-item"><div class="file-icon" style="background:#f59e0b"></div><div class="file-bar" style="width:110px"></div></div>
          <div class="file-tree-item" style="margin-left:14px"><div class="file-icon" style="background:#38bdf8"></div><div class="file-bar" style="width:80px"></div></div>
          <div class="file-tree-item" style="margin-left:14px"><div class="file-icon" style="background:#38bdf8"></div><div class="file-bar" style="width:95px"></div></div>
          <div class="file-tree-item" style="margin-left:14px"><div class="file-icon" style="background:#10b981"></div><div class="file-bar" style="width:70px"></div></div>
          <div class="file-tree-item"><div class="file-icon" style="background:#6366f1"></div><div class="file-bar" style="width:120px"></div></div>
          <div class="file-tree-item" style="margin-left:14px"><div class="file-icon" style="background:#38bdf8"></div><div class="file-bar" style="width:85px"></div></div>
          <div class="file-tree-item" style="margin-left:14px"><div class="file-icon" style="background:#f43f5e"></div><div class="file-bar" style="width:105px"></div></div>
        </div>

        <div class="ide-editor">
          <div class="editor-tabs">
            <div class="editor-tab"><div class="file-icon" style="background:#38bdf8;width:10px;height:10px"></div><div class="file-bar" style="width:60px"></div></div>
            <div class="editor-tab" style="background:transparent;border:none;opacity:0.4"><div class="file-icon" style="background:#10b981;width:10px;height:10px"></div><div class="file-bar" style="width:50px"></div></div>
          </div>
          <div class="editor-code">
            <div class="code-line"><div class="line-no"></div><div class="token-kw"></div><div class="token-fn"></div></div>
            <div class="code-line indent-1"><div class="line-no"></div><div class="token-cm"></div></div>
            <div class="code-line indent-1"><div class="line-no"></div><div class="token-kw" style="width:45px"></div><div class="token-type"></div><div class="token-var"></div></div>
            <div class="code-line indent-2"><div class="line-no"></div><div class="token-fn" style="width:110px"></div><div class="token-val"></div></div>
            <div class="code-line indent-2"><div class="line-no"></div><div class="token-var" style="width:80px"></div><div class="token-fn" style="width:60px"></div><div class="token-val" style="width:40px"></div></div>
            <div class="code-line indent-1"><div class="line-no"></div><div class="token-kw" style="width:30px"></div></div>
            <div class="code-line"><div class="line-no"></div></div>
            <div class="code-line indent-1"><div class="line-no"></div><div class="token-kw" style="width:50px"></div><div class="token-type" style="width:85px"></div><div class="token-fn"></div></div>
            <div class="code-line indent-2"><div class="line-no"></div><div class="token-var" style="width:65px"></div><div class="token-fn" style="width:95px"></div></div>
            <div class="code-line indent-2"><div class="line-no"></div><div class="token-kw" style="width:40px"></div><div class="token-val" style="width:90px"></div></div>
            <div class="code-line indent-1"><div class="line-no"></div><div class="token-kw" style="width:30px"></div></div>
          </div>
        </div>

        <div class="ide-right-pane">
          <div class="stat-card">
            <div style="height:8px;width:70px;background:#475569;border-radius:4px"></div>
            <div class="sparkline"></div>
          </div>
          <div class="stat-card">
            <div style="height:8px;width:90px;background:#475569;border-radius:4px"></div>
            <div style="display:flex;gap:6px;margin-top:6px">
              <div style="flex:1;height:24px;background:#10b981;opacity:0.25;border-radius:4px"></div>
              <div style="flex:1;height:24px;background:#38bdf8;opacity:0.25;border-radius:4px"></div>
              <div style="flex:1;height:24px;background:#6366f1;opacity:0.25;border-radius:4px"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="monitor-neck"></div>
    <div class="monitor-base"></div>

    <div class="desk-surface">
      <div class="keyboard">
        <div class="kb-row"><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div></div>
        <div class="kb-row"><div class="key mod"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key mod"></div></div>
        <div class="kb-row"><div class="key mod"></div><div class="key"></div><div class="key"></div><div class="key space"></div><div class="key"></div><div class="key"></div><div class="key mod"></div></div>
      </div>
      <div class="mouse"></div>
    </div>
  </div>
</body>
</html>
